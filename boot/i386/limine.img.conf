# BARE! - boots straight into the instrument. The active kernel slots are flipped by the updater (HB_A.ELF / HB_B.ELF,
# and H64_A.ELF / H64_B.ELF for the 64-bit kernel).
timeout: 0
quiet: yes

# UEFI on a 64-bit CPU: the 64-bit kernel. It reaches what the firmware puts above 4 GiB (recent Intel graphics put the
# framebuffer there, and firmware the USB controller).
/BARE (UEFI)
    if_fw_type: UEFI
    if_arch: x86-64
    protocol: limine
    path: boot():/BOOT/H64_A.ELF

/BARE
    protocol: multiboot2
    path: boot():/BOOT/HB_A.ELF
