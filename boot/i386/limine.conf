# Boot straight into the instrument: no menu, no timeout.
timeout: 0
quiet: yes

# UEFI on a 64-bit CPU: the 64-bit kernel. It reaches what the firmware puts above 4 GiB (recent Intel graphics put the
# framebuffer there), and UEFI has no BIOS disk services for the 32-bit one's saving anyway.
/BARE (UEFI)
    if_fw_type: UEFI
    if_arch: x86-64
    protocol: limine
    path: boot():/boot/bare64.elf

/BARE
    protocol: multiboot2
    path: boot():/boot/bare.elf
